<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maisu</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="hasnav">
<header><button class="ghost" id="back" hidden>← Назад</button><h1 id="title"></h1></header>
<main id="app"><div class="empty">Загрузка…</div></main>
<nav id="tabs"><button data-t="home" class="on">Каталог</button><button data-t="news">Новости</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C=window.CFG, tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==="dark"?"dark":"light"}
else if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bg=u=>u?`style="background-image:url('${esc(u)}')"`:"";
let products=[],news=[],catImg={},banner="",view={n:"home"},hist=[],selSize=null;
const inStock=p=>Object.values(p.sizes||{}).some(v=>v===true);
function go(v){hist.push(view);view=v;selSize=null;render();scrollTo(0,0)}
function back(){view=hist.pop()||{n:"home"};selSize=null;render();scrollTo(0,0)}
function tab(n){hist=[];view={n};selSize=null;render();scrollTo(0,0)}
$("#back").onclick=back;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
function render(){
  $("#back").hidden=view.n==="home"||view.n==="news";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===(view.n==="news"?"news":"home")));
  ({home,cat,prod,news:newsView})[view.n]();
}
function allCats(){const s=new Set(C.CATEGORIES);products.forEach(p=>s.add(p.category));return[...s].filter(c=>products.some(p=>p.category===c))}
function home(){
  $("#title").textContent=C.SHOP;
  const top=banner?`<img class="bimg" src="${esc(banner)}" alt="">`:`<div class="banner"><b>${esc(C.BANNER_TITLE)}</b><span>${products.length?"Выберите категорию ниже":"Скоро здесь появятся товары"}</span></div>`;
  if(!products.length){app.innerHTML=top;return}
  app.innerHTML=top+`<h2>Категории</h2><div class="cats">${allCats().map(c=>{const l=products.filter(p=>p.category===c);return`<div class="cat" data-c="${esc(c)}"><div class="im" ${bg(catImg[c]||l[0].photos?.[0])}></div><div class="t">${esc(c)} <small>${l.length}</small></div></div>`}).join("")}</div>`;
  app.querySelectorAll(".cat").forEach(e=>e.onclick=()=>go({n:"cat",c:e.dataset.c}));
}
function cat(){
  $("#title").textContent=view.c;
  app.innerHTML=`<div class="grid">${products.filter(p=>p.category===view.c).map(p=>`<div class="p ${inStock(p)?"":"out"}" data-id="${p.id}"><div class="im" ${bg(p.photos?.[0])}></div><div class="n">${esc(p.name)}</div><div class="pr">${esc(p.price)}</div></div>`).join("")}</div>`;
  app.querySelectorAll(".p").forEach(e=>e.onclick=()=>go({n:"prod",id:e.dataset.id}));
}
function prod(){
  const p=products.find(x=>x.id===view.id);if(!p){app.innerHTML='<div class="empty">Товар не найден</div>';return}
  $("#title").textContent=p.category;
  const sz=C.SIZES.filter(s=>s in (p.sizes||{}));
  app.innerHTML=`<div class="gal">${(p.photos||[]).map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>
  <div class="pad"><div class="price">${esc(p.price)}</div><div style="font-size:19px">${esc(p.name)}</div>
  <h2 style="margin:18px 0 6px">Размеры</h2><div class="sizes">${sz.length?sz.map(s=>`<div class="sz ${p.sizes[s]?"":"no"} ${selSize===s?"sel":""}" data-s="${s}">${s}</div>`).join(""):'<span class="hint">Не указаны</span>'}</div>
  <div class="hint">Зачёркнутые размеры закончились</div>
  <h2 style="margin:18px 0 6px">Описание</h2><div class="desc">${esc(p.description)}</div>
  <button class="order" id="order">Написать менеджеру</button></div>`;
  app.querySelectorAll(".sz:not(.no)").forEach(e=>e.onclick=()=>{selSize=selSize===e.dataset.s?null:e.dataset.s;prod()});
  $("#order").onclick=()=>{
    const t=`Здравствуйте! Хочу заказать: ${p.name}${p.price?" ("+p.price+")":""}${selSize?", размер "+selSize:""}`;
    const url=`https://t.me/${C.MANAGER}?text=${encodeURIComponent(t)}`;
    tg?tg.openTelegramLink(url):window.open(url,"_blank");
  };
}
function newsView(){
  $("#title").textContent="Новости";
  app.innerHTML=news.length?news.map(n=>`<div class="news">${n.image?`<img src="${esc(n.image)}" alt="">`:""}<div class="b"><b>${esc(n.title)}</b><small>${new Date(n.created_at).toLocaleDateString("ru-RU")}</small><p>${esc(n.body)}</p></div></div>`).join(""):'<div class="empty">Новостей пока нет</div>';
}
(async()=>{
  render();
  const g=async(t,o)=>{let q=sb.from(t).select("*");if(o)q=q.order(o,{ascending:false});const{data,error}=await q;return error?null:data};
  const [p,c,n,s]=await Promise.all([g("products","created_at"),g("categories"),g("news","created_at"),g("settings")]);
  if(!p){app.innerHTML='<div class="empty">Не удалось загрузить каталог. Попробуйте позже.</div>';return}
  products=p;news=n||[];(c||[]).forEach(r=>catImg[r.name]=r.image);banner=((s||[]).find(r=>r.key==="banner")||{}).value||"";
  render();
})();
</script>
</body>
</html>
