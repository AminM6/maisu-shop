<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maisu — админка</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><button class="ghost" id="back" hidden>←</button><h1 id="title">Админка</h1><button class="ghost" id="out" hidden>Выйти</button></header>
<main id="app"><div class="empty">Загрузка…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C=window.CFG;
if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bg=u=>u?`style="background-image:url('${esc(u)}')"`:"";
let products=[],news=[],catRows={},banner='',form=null,tab='prod';
const cats=()=>[...new Set([...C.CATEGORIES,...products.map(p=>p.category)])];
$("#out").onclick=async()=>{await sb.auth.signOut();login()};
$("#back").onclick=()=>list();

function login(){
  $("#back").hidden=true;$("#out").hidden=true;$("#title").textContent="Вход";
  app.innerHTML=`<div class="pad"><label>Почта</label><input id="em" type="email" autocomplete="username"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password"><button id="go" style="width:100%;margin-top:18px">Войти</button><div class="hint" id="er" style="color:#d33"></div></div>`;
  $("#go").onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){$("#er").textContent="Неверная почта или пароль";return}
    load();
  };
}
async function up(f){const b=await resize(f),p=crypto.randomUUID()+".jpg";
  const {error}=await sb.storage.from("photos").upload(p,b,{contentType:"image/jpeg",cacheControl:"31536000"});
  if(error)throw error;return sb.storage.from("photos").getPublicUrl(p).data.publicUrl}
const T=[["prod","Товары"],["cats","Категории"],["news","Новости"],["ban","Шапка"]];
function shell(h){$("#back").hidden=true;$("#out").hidden=false;$("#title").textContent="Админка";
  app.innerHTML=`<div class="atabs">${T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div><div class="pad">${h}</div>`;
  app.querySelectorAll(".atabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;list()})}
const fail=e=>alert("Ошибка: "+(e.message||e));
async function load(){
  const g=async(t,o)=>{let q=sb.from(t).select("*");if(o)q=q.order(o,{ascending:false});const {data,error}=await q;return error?null:data};
  const [p,c,n,s]=await Promise.all([g("products","created_at"),g("categories"),g("news","created_at"),g("settings")]);
  if(!p){app.innerHTML='<div class="empty">Ошибка загрузки товаров</div>';return}
  products=p;news=n||[];catRows={};(c||[]).forEach(r=>catRows[r.name]=r.image);banner=((s||[]).find(r=>r.key==="banner")||{}).value||"";list();
}
function list(){
  if(tab==="cats")return tCats();if(tab==="news")return tNews();if(tab==="ban")return tBan();
  shell(`<button id="new" style="width:100%;margin-bottom:8px">+ Добавить товар</button>${products.map(p=>`<div class="row"><div class="im" ${bg(p.photos?.[0])}></div><div class="tx"><div>${esc(p.name)}</div><small>${esc(p.category)} · ${esc(p.price)}</small></div><button class="ghost" data-e="${p.id}">Изменить</button></div>`).join("")||'<div class="empty">Пока пусто</div>'}`);
  $("#new").onclick=()=>{form={id:null,name:"",price:"",category:C.CATEGORIES[0]||"",description:"",photos:[],sizes:{}};edit()};
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{form=JSON.parse(JSON.stringify(products.find(x=>x.id===b.dataset.e)));edit()});
}
function tCats(){
  shell(`<div class="hint">Выберите картинку для категории. Если её нет, берётся первое фото товара.</div>${cats().map(c=>`<div class="row"><div class="im" ${bg(catRows[c])}></div><div class="tx"><div>${esc(c)}</div><input type="file" accept="image/*" data-c="${esc(c)}"></div>${catRows[c]?`<button class="danger" data-r="${esc(c)}">Убрать</button>`:""}</div>`).join("")}`);
  app.querySelectorAll("[data-c]").forEach(i=>i.onchange=async()=>{try{const u=await up(i.files[0]);const {error}=await sb.from("categories").upsert({name:i.dataset.c,image:u});if(error)throw error;load()}catch(e){fail(e)}});
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const {error}=await sb.from("categories").delete().eq("name",b.dataset.r);error?fail(error):load()});
}
function tBan(){
  shell(`<div class="hint">Картинка вверху главной страницы (лучше 16:9, например 1600×900). Текст «Новая коллекция» делайте прямо на картинке.</div>${banner?`<img class="prev" src="${esc(banner)}">`:'<div class="empty">Сейчас показывается текстовая шапка</div>'}<input type="file" id="bf" accept="image/*">${banner?'<button class="danger" id="br">Убрать картинку</button>':""}`);
  $("#bf").onchange=async e=>{try{const u=await up(e.target.files[0]);const {error}=await sb.from("settings").upsert({key:"banner",value:u});if(error)throw error;load()}catch(x){fail(x)}};
  const r=$("#br");if(r)r.onclick=async()=>{const {error}=await sb.from("settings").delete().eq("key","banner");error?fail(error):load()};
}
function tNews(){
  shell(`<label>Заголовок</label><input id="nt"><label>Текст</label><textarea id="nb"></textarea><label>Фото (необязательно)</label><input type="file" id="nf" accept="image/*"><button id="np" style="width:100%;margin:16px 0">Опубликовать</button>${news.map(n=>`<div class="row"><div class="im" ${bg(n.image)}></div><div class="tx"><div>${esc(n.title)}</div><small>${new Date(n.created_at).toLocaleDateString("ru-RU")}</small></div><button class="danger" data-d="${n.id}">Удалить</button></div>`).join("")}`);
  $("#np").onclick=async()=>{const t=$("#nt").value.trim();if(!t){alert("Укажите заголовок");return}
    try{const f=$("#nf").files[0];const image=f?await up(f):null;const {error}=await sb.from("news").insert({title:t,body:$("#nb").value,image});if(error)throw error;load()}catch(e){fail(e)}};
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить новость?"))return;const {error}=await sb.from("news").delete().eq("id",b.dataset.d);error?fail(error):load()});
}
function resize(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error("resize")),"image/jpeg",0.85)};
  img.onerror=()=>rej(new Error("img"));img.src=u})}
function edit(){
  $("#back").hidden=false;$("#back").textContent="← Назад";$("#out").hidden=true;$("#title").textContent=form.id?"Редактирование":"Новый товар";
  app.innerHTML=`<div class="pad">
  <label>Название</label><input id="f-name" value="${esc(form.name)}">
  <label>Цена</label><input id="f-price" value="${esc(form.price)}" placeholder="напр. 49 €">
  <label>Категория</label><input id="f-cat" list="cl" value="${esc(form.category)}"><datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <label>Описание</label><textarea id="f-desc">${esc(form.description)}</textarea>
  <label>Фото (первое — главное)</label><input type="file" id="f-file" accept="image/*" multiple>
  <div class="hint" id="up"></div>
  <div class="th">${form.photos.map((u,i)=>`<div ${bg(u)}><i data-x="${i}">×</i></div>`).join("")}</div>
  <label>Размеры</label><div class="hint">Нажимайте на размер: нет → в наличии → закончился</div>
  <div class="sizes" id="f-sz">${C.SIZES.map(s=>{const v=form.sizes[s];return`<div class="sz ${v===true?"":v===false?"no":"none"}" data-s="${s}">${s}</div>`}).join("")}</div>
  <div style="display:flex;gap:8px;margin-top:20px"><button id="save" style="flex:1">Сохранить</button>${form.id?'<button class="danger" id="del">Удалить</button>':""}</div></div>`;
  const keep=()=>{form.name=$("#f-name").value;form.price=$("#f-price").value;form.category=$("#f-cat").value.trim();form.description=$("#f-desc").value};
  $("#f-sz").onclick=e=>{const s=e.target.dataset.s;if(!s)return;keep();const v=form.sizes[s];if(v===undefined)form.sizes[s]=true;else if(v===true)form.sizes[s]=false;else delete form.sizes[s];edit()};
  app.querySelectorAll("[data-x]").forEach(i=>i.onclick=()=>{keep();form.photos.splice(+i.dataset.x,1);edit()});
  $("#f-file").onchange=async e=>{keep();const files=[...e.target.files];let n=0;
    for(const f of files){$("#up").textContent=`Загрузка ${++n} из ${files.length}…`;
      try{form.photos.push(await up(f))}catch(err){alert("Не удалось загрузить фото: "+(err.message||""))}}
    edit()};
  $("#save").onclick=async()=>{keep();if(!form.name||!form.category){alert("Укажите название и категорию");return}
    const d={name:form.name,price:form.price,category:form.category,description:form.description,photos:form.photos,sizes:form.sizes};
    const {error}=form.id?await sb.from("products").update(d).eq("id",form.id):await sb.from("products").insert(d);
    if(error){alert("Не удалось сохранить: "+error.message);return}
    load()};
  const del=$("#del");if(del)del.onclick=async()=>{if(!confirm("Удалить товар?"))return;
    const {error}=await sb.from("products").delete().eq("id",form.id);
    if(error){alert("Не удалось удалить: "+error.message);return}load()};
}
(async()=>{const {data}=await sb.auth.getSession();data.session?load():login()})();
</script>
</body>
</html>
